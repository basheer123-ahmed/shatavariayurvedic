<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="100%" height="100%">
  <defs>
    <radialGradient id="hero-aura" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EEDFB8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#E2D0A5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="40%" stop-color="#FFF3A8" />
      <stop offset="80%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <filter id="hero-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#122518" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Aura & Stage Podium -->
  <ellipse cx="350" cy="520" rx="300" ry="40" fill="url(#hero-aura)" />
  <ellipse cx="350" cy="525" rx="220" ry="22" fill="#182A1B" opacity="0.15" />

  <!-- Botanical foliage in background -->
  <g opacity="0.25" transform="translate(80, 100)">
    <path d="M 0 160 C 90 60 180 30 260 0 C 220 80 180 180 80 220 Z" fill="#2D5A3A" />
    <path d="M 20 150 Q 130 80 240 20" stroke="#1B3E25" stroke-width="3" fill="none" />
  </g>
  <g opacity="0.25" transform="translate(620, 120) scale(-1, 1)">
    <path d="M 0 160 C 90 60 180 30 260 0 C 220 80 180 180 80 220 Z" fill="#2D5A3A" />
  </g>

  <!-- LEFT PRODUCT: Pure Shatavari Juice Bottle (Tilted slightly back) -->
  <g transform="translate(80, 120) scale(0.85)" filter="url(#hero-shadow)">
    <!-- Body -->
    <path d="M 180 140 L 220 140 L 220 115 L 280 115 L 280 140 L 320 140 C 345 140 365 160 365 190 L 365 420 C 365 440 345 455 320 455 L 180 455 C 155 455 135 440 135 420 L 135 190 C 135 160 155 140 180 140 Z" fill="#1B4228" />
    <!-- Cap -->
    <rect x="212" y="70" width="76" height="52" rx="6" fill="url(#gold-metal)" stroke="#8C6510" stroke-width="2" />
    <rect x="210" y="122" width="80" height="18" rx="4" fill="#D4AF37" />
    <!-- Label -->
    <rect x="145" y="200" width="210" height="205" rx="8" fill="#0C2516" stroke="#D4AF37" stroke-width="2" />
    <circle cx="250" cy="235" r="16" fill="#D4AF37" opacity="0.3" />
    <text x="250" y="258" font-family="'Playfair Display', serif" font-size="11" font-weight="700" fill="#D4AF37" text-anchor="middle">SHATAVARI</text>
    <text x="250" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FFF" text-anchor="middle">AYURVEDIC</text>
    <text x="250" y="300" font-family="'Playfair Display', serif" font-size="16" font-weight="800" fill="#FFF" text-anchor="middle">PURE SHATAVARI</text>
    <text x="250" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E8D7BF" text-anchor="middle">Wild Harvest Juice</text>
    <rect x="180" y="334" width="140" height="20" rx="10" fill="#D4AF37" />
    <text x="250" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1A180E" text-anchor="middle">500 ML • WILD HERB</text>
  </g>

  <!-- RIGHT PRODUCT: Kumkumadi Tailam Dropper Bottle -->
  <g transform="translate(370, 160) scale(0.82)" filter="url(#hero-shadow)">
    <!-- Dropper Bulb & Pipette -->
    <path d="M 238 65 C 238 52 242 45 250 45 C 258 45 262 52 262 65 L 260 85 L 240 85 Z" fill="#222222" />
    <rect x="232" y="85" width="36" height="40" rx="3" fill="url(#gold-metal)" />
    <!-- Body -->
    <path d="M 200 140 L 226 140 L 226 135 L 274 135 L 274 140 L 300 140 C 322 140 338 156 340 180 L 340 410 C 340 435 322 450 295 450 L 205 450 C 178 450 160 435 160 410 L 160 180 C 162 156 178 140 200 140 Z" fill="#BD4B17" />
    <rect x="170" y="195" width="160" height="210" rx="6" fill="#290E05" stroke="#FFD700" stroke-width="2" />
    <circle cx="250" cy="230" r="15" fill="#FFD700" opacity="0.3" />
    <text x="250" y="254" font-family="'Playfair Display', serif" font-size="10" font-weight="700" fill="#FFD700" text-anchor="middle">SHATAVARI</text>
    <text x="250" y="295" font-family="'Playfair Display', serif" font-size="14" font-weight="800" fill="#FFF" text-anchor="middle">KUMKUMADI</text>
    <text x="250" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#E8D7BF" text-anchor="middle">Miraculous Beauty Oil</text>
    <rect x="185" y="330" width="130" height="20" rx="10" fill="#FFD700" />
    <text x="250" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1C1402" text-anchor="middle">KASHMIRI SAFFRON</text>
  </g>

  <!-- CENTER FRONT PRODUCT: Shatavari Kalpa Premium Granules Jar -->
  <g transform="translate(195, 115) scale(1.05)" filter="url(#hero-shadow)">
    <!-- Cap -->
    <rect x="145" y="120" width="210" height="44" rx="10" fill="url(#gold-metal)" stroke="#8C6510" stroke-width="2" />
    <rect x="155" y="130" width="190" height="6" fill="#FFFFFF" opacity="0.4" rx="3" />
    <rect x="160" y="164" width="180" height="16" fill="#D4AF37" />
    <!-- Jar Body -->
    <rect x="135" y="180" width="230" height="240" rx="20" fill="#F8F4EC" stroke="#DDD1BE" stroke-width="2" />
    <!-- High gloss -->
    <path d="M 148 190 L 148 400 C 148 406 154 410 162 410 L 162 190 Z" fill="#FFFFFF" opacity="0.5" />
    <!-- Label -->
    <rect x="152" y="202" width="196" height="195" rx="10" fill="#153C27" stroke="#D4AF37" stroke-width="2.5" />
    <rect x="158" y="208" width="184" height="183" rx="8" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 3" />
    <!-- Emblem -->
    <circle cx="250" cy="236" r="18" fill="#D4AF37" opacity="0.3" />
    <path d="M 250 220 C 242 227 242 238 250 245 C 258 238 258 227 250 220 Z" fill="#D4AF37" />
    <text x="250" y="260" font-family="'Playfair Display', serif" font-size="12" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="2">SHATAVARI</text>
    <text x="250" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#E8D7BF" text-anchor="middle" letter-spacing="1.5">AYURVEDIC</text>
    <line x1="185" y1="280" x2="315" y2="280" stroke="#D4AF37" stroke-width="1.2" />
    <text x="250" y="303" font-family="'Playfair Display', serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">SHATAVARI KALPA</text>
    <text x="250" y="322" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#E8D7BF" text-anchor="middle">With Pure Desi Ghee &amp; Elaichi</text>
    <rect x="175" y="336" width="150" height="24" rx="12" fill="url(#gold-metal)" />
    <text x="250" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#1C1808" text-anchor="middle" letter-spacing="1">AUTHENTIC RASAYANA</text>
    <text x="250" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">NET WT: 250 G</text>
  </g>

  <!-- 100% Certified Vedic Seal in Bottom Right -->
  <g transform="translate(540, 440)">
    <circle cx="50" cy="50" r="46" fill="url(#gold-metal)" stroke="#7A5808" stroke-width="2" filter="url(#hero-shadow)" />
    <circle cx="50" cy="50" r="40" fill="#153C27" />
    <circle cx="50" cy="50" r="37" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 2" />
    <text x="50" y="42" font-family="'Playfair Display', serif" font-size="10" font-weight="800" fill="#D4AF37" text-anchor="middle">100% PURE</text>
    <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#FFF" text-anchor="middle">AYURVEDIC</text>
    <text x="50" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#E8D7BF" text-anchor="middle">CERTIFIED</text>
  </g>
</svg>