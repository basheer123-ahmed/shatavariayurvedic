<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="cat-grad-DailyWellness" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8C5E32" />
      <stop offset="85%" stop-color="#4A2B0E" />
      <stop offset="100%" stop-color="#08140B" />
    </radialGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC468" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#ECC468" />
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F2415" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Glow -->
  <circle cx="150" cy="150" r="140" fill="url(#cat-grad-DailyWellness)" filter="url(#cat-shadow)" />
  <!-- Golden Ring -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="url(#gold-border)" stroke-width="3" />
  <circle cx="150" cy="150" r="126" fill="none" stroke="#ECC468" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Botanical Art Center -->
  <g transform="translate(150, 140)">
    <!-- Central Herbal Leaf Motif -->
    <path d="M 0 -60 C 40 -30 45 25 0 60 C -45 25 -40 -30 0 -60 Z" fill="#ECC468" opacity="0.9" />
    <path d="M 0 -50 C 25 -20 30 20 0 45 C -30 20 -25 -20 0 -50 Z" fill="#FFFFFF" opacity="0.25" />
    <!-- Leaf veins -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#102E19" stroke-width="2.5" />
    <line x1="0" y1="-20" x2="16" y2="-5" stroke="#102E19" stroke-width="2" />
    <line x1="0" y1="-5" x2="-16" y2="10" stroke="#102E19" stroke-width="2" />
    <line x1="0" y1="12" x2="14" y2="24" stroke="#102E19" stroke-width="2" />
    <!-- Flanking botanical sprouts -->
    <path d="M -25 15 C -45 5 -55 -20 -40 -35 C -35 -15 -25 0 -15 10 Z" fill="#ECC468" opacity="0.75" />
    <path d="M 25 15 C 45 5 55 -20 40 -35 C 35 -15 25 0 15 10 Z" fill="#ECC468" opacity="0.75" />
  </g>

  <!-- Banner Plate -->
  <rect x="40" y="215" width="220" height="42" rx="21" fill="#FFFFFF" stroke="#ECC468" stroke-width="2" filter="url(#cat-shadow)" />
  <text x="150" y="241" font-family="'Playfair Display', serif" font-size="14.5" font-weight="700" fill="#153C27" text-anchor="middle" letter-spacing="0.5">Daily Wellness</text>
</svg>