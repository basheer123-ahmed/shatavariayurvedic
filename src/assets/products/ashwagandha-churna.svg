<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for realistic soft shadow -->
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#122417" flood-opacity="0.18" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Body Gradient -->
    <linearGradient id="ashwagandha-churna-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE5D5" />
      <stop offset="50%" stop-color="#DDCBB0" />
      <stop offset="100%" stop-color="#EFE5D5" />
    </linearGradient>
    <!-- Cap Metallic Gradient -->
    <linearGradient id="ashwagandha-churna-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C3817" />
      <stop offset="35%" stop-color="#FFF2A3" />
      <stop offset="70%" stop-color="#5C3817" />
      <stop offset="100%" stop-color="#9E7618" />
    </linearGradient>
    <!-- Background Podium Aura -->
    <radialGradient id="ashwagandha-churna-podium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DFCD" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FBF8F2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean Subtle Background Podium -->
  <ellipse cx="250" cy="450" rx="190" ry="24" fill="url(#ashwagandha-churna-podium)" />
  <ellipse cx="250" cy="452" rx="140" ry="14" fill="#203323" opacity="0.12" />

  <!-- Botanical Leaf Accent in Background -->
  <g opacity="0.14" transform="translate(40, 60)">
    <path d="M 0 100 C 50 40 100 20 160 0 C 130 50 100 120 40 140 Z" fill="#8C5E32" />
    <path d="M 10 95 Q 80 50 150 10" stroke="#8C5E32" stroke-width="2" fill="none" />
  </g>
  <g opacity="0.12" transform="translate(360, 280) scale(-1, 1)">
    <path d="M 0 100 C 50 40 100 20 160 0 C 130 50 100 120 40 140 Z" fill="#E6C665" />
  </g>

  
      <!-- Cap -->
      <rect x="160" y="115" width="180" height="38" rx="8" fill="url(#ashwagandha-churna-cap)" stroke="#9A7010" stroke-width="2" filter="url(#drop-shadow)" />
      <rect x="170" y="125" width="160" height="5" fill="#FFFFFF" opacity="0.35" rx="2" />
      <rect x="175" y="153" width="150" height="14" fill="#E6C665" />
      <!-- Body -->
      <rect x="145" y="167" width="210" height="260" rx="18" fill="url(#ashwagandha-churna-body)" filter="url(#drop-shadow)" stroke="#E0D6C3" stroke-width="1.5" />
      <!-- Highlights -->
      <rect x="156" y="180" width="14" height="230" rx="7" fill="#FFFFFF" opacity="0.25" />
      <!-- Label -->
      <rect x="155" y="200" width="190" height="205" rx="8" fill="#4A2B0E" stroke="#E6C665" stroke-width="2.2" />
      <rect x="161" y="206" width="178" height="193" rx="6" fill="none" stroke="#E6C665" stroke-width="1" stroke-dasharray="5 3" />
      <!-- Emblem -->
      <circle cx="250" cy="235" r="18" fill="#E6C665" opacity="0.25" />
      <path d="M 250 220 Q 240 230 250 242 Q 260 230 250 220 Z" fill="#E6C665" />
      <text x="250" y="258" font-family="'Playfair Display', serif" font-size="11" font-weight="700" fill="#E6C665" text-anchor="middle" letter-spacing="2">SHATAVARI</text>
      <text x="250" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E8D7BF" text-anchor="middle" letter-spacing="1.5">AYURVEDIC</text>
      <!-- Title -->
      <line x1="185" y1="278" x2="315" y2="278" stroke="#E6C665" stroke-width="1.2" />
      <text x="250" y="300" font-family="'Playfair Display', serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">ASHWAGANDHA ROOT</text>
      <text x="250" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#D6C4A5" text-anchor="middle">Stress & Vigor Powder</text>
      <!-- Tag Badge -->
      <rect x="175" y="332" width="150" height="22" rx="11" fill="#E6C665" />
      <text x="250" y="347" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1C1808" text-anchor="middle" letter-spacing="1">ORGANIC ROOT CHURNA</text>
      <text x="250" y="374" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#E6C665" text-anchor="middle">AUTHENTIC HERBAL QUALITY</text>
      <text x="250" y="394" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">QTY: 150 g</text>
    
</svg>