<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for realistic soft shadow -->
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#122417" flood-opacity="0.18" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Body Gradient -->
    <linearGradient id="giloy-juice-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A6B25" />
      <stop offset="50%" stop-color="#1B3B0C" />
      <stop offset="100%" stop-color="#3A6B25" />
    </linearGradient>
    <!-- Cap Metallic Gradient -->
    <linearGradient id="giloy-juice-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D47D11" />
      <stop offset="35%" stop-color="#FFF2A3" />
      <stop offset="70%" stop-color="#D47D11" />
      <stop offset="100%" stop-color="#9E7618" />
    </linearGradient>
    <!-- Background Podium Aura -->
    <radialGradient id="giloy-juice-podium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DFCD" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FBF8F2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean Subtle Background Podium -->
  <ellipse cx="250" cy="450" rx="190" ry="24" fill="url(#giloy-juice-podium)" />
  <ellipse cx="250" cy="452" rx="140" ry="14" fill="#203323" opacity="0.12" />

  <!-- Botanical Leaf Accent in Background -->
  <g opacity="0.14" transform="translate(40, 60)">
    <path d="M 0 100 C 50 40 100 20 160 0 C 130 50 100 120 40 140 Z" fill="#2E5E1C" />
    <path d="M 10 95 Q 80 50 150 10" stroke="#2E5E1C" stroke-width="2" fill="none" />
  </g>
  <g opacity="0.12" transform="translate(360, 280) scale(-1, 1)">
    <path d="M 0 100 C 50 40 100 20 160 0 C 130 50 100 120 40 140 Z" fill="#F59A23" />
  </g>

  
      <!-- Bottle Body -->
      <path d="M 180 140 L 220 140 L 220 115 L 280 115 L 280 140 L 320 140 C 345 140 365 160 365 190 L 365 420 C 365 440 345 455 320 455 L 180 455 C 155 455 135 440 135 420 L 135 190 C 135 160 155 140 180 140 Z" fill="url(#giloy-juice-body)" filter="url(#drop-shadow)" />
      <!-- Bottle Highlights -->
      <path d="M 148 190 L 148 420 C 148 430 155 440 168 444 L 168 185 C 155 186 148 188 148 190 Z" fill="#FFFFFF" opacity="0.22" />
      <path d="M 345 195 L 345 415" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.15" />
      <!-- Golden Neck Ring & Measuring Cap -->
      <rect x="212" y="70" width="76" height="52" rx="6" fill="url(#giloy-juice-cap)" stroke="#9A7010" stroke-width="2" />
      <line x1="216" y1="88" x2="284" y2="88" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
      <line x1="216" y1="102" x2="284" y2="102" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
      <rect x="210" y="122" width="80" height="18" rx="4" fill="#F59A23" stroke="#9A7010" stroke-width="1.5" />
      <!-- Main Product Label -->
      <rect x="145" y="200" width="210" height="205" rx="8" fill="#1B380E" stroke="#F59A23" stroke-width="2.5" />
      <!-- Label Gold Inner Border -->
      <rect x="151" y="206" width="198" height="193" rx="5" fill="none" stroke="#F59A23" stroke-width="1" stroke-dasharray="6 3" />
      <!-- Brand Emblem -->
      <circle cx="250" cy="235" r="18" fill="#F59A23" opacity="0.2" />
      <path d="M 250 220 C 242 227 242 238 250 245 C 258 238 258 227 250 220 Z" fill="#F59A23" />
      <text x="250" y="258" font-family="'Playfair Display', serif" font-size="11" font-weight="700" fill="#F59A23" text-anchor="middle" letter-spacing="2">SHATAVARI</text>
      <text x="250" y="269" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#E6D2B5" text-anchor="middle" letter-spacing="1.5">AYURVEDIC</text>
      <!-- Gold Separator -->
      <line x1="180" y1="277" x2="320" y2="277" stroke="#F59A23" stroke-width="1.2" />
      <polygon points="250,274 253,277 250,280 247,277" fill="#F59A23" />
      <!-- Title & Subtitle -->
      <text x="250" y="298" font-family="'Playfair Display', serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GILOY PAPAYA JUICE</text>
      <text x="250" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#D6C4A5" text-anchor="middle">Platelet & Immune Shield</text>
      <!-- Tag Pill -->
      <rect x="175" y="332" width="150" height="20" rx="10" fill="#F59A23" />
      <text x="250" y="346" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1C1808" text-anchor="middle" letter-spacing="1">AMRITA ELIXIR</text>
      <!-- Botanical Details & Specs -->
      <text x="250" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#F59A23" text-anchor="middle" letter-spacing="0.5">● 100% PURE & NATURAL ●</text>
      <text x="250" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">NET VOL: 500 ml</text>
    
</svg>