<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for realistic soft shadow -->
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#122417" flood-opacity="0.18" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Body Gradient -->
    <linearGradient id="onion-shampoo-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#59132E" />
      <stop offset="50%" stop-color="#300817" />
      <stop offset="100%" stop-color="#59132E" />
    </linearGradient>
    <!-- Cap Metallic Gradient -->
    <linearGradient id="onion-shampoo-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="35%" stop-color="#FFF2A3" />
      <stop offset="70%" stop-color="#242424" />
      <stop offset="100%" stop-color="#9E7618" />
    </linearGradient>
    <!-- Background Podium Aura -->
    <radialGradient id="onion-shampoo-podium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DFCD" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FBF8F2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean Subtle Background Podium -->
  <ellipse cx="250" cy="450" rx="190" ry="24" fill="url(#onion-shampoo-podium)" />
  <ellipse cx="250" cy="452" rx="140" ry="14" fill="#203323" opacity="0.12" />

  <!-- Botanical Leaf Accent in Background -->
  <g opacity="0.14" transform="translate(40, 60)">
    <path d="M 0 100 C 50 40 100 20 160 0 C 130 50 100 120 40 140 Z" fill="#781D42" />
    <path d="M 10 95 Q 80 50 150 10" stroke="#781D42" stroke-width="2" fill="none" />
  </g>
  <g opacity="0.12" transform="translate(360, 280) scale(-1, 1)">
    <path d="M 0 100 C 50 40 100 20 160 0 C 130 50 100 120 40 140 Z" fill="#F7A7C0" />
  </g>

  
      <!-- Pump Head or Dispenser -->
      <path d="M 245 60 L 295 60 C 298 60 300 64 298 68 L 290 85 L 245 85 Z" fill="#202020" />
      <rect x="242" y="85" width="16" height="25" fill="#333333" />
      <rect x="232" y="110" width="36" height="25" rx="3" fill="url(#onion-shampoo-cap)" stroke="#806010" stroke-width="1.5" />
      <rect x="226" y="135" width="48" height="15" fill="#F7A7C0" />
      <!-- Bottle Body -->
      <rect x="155" y="150" width="190" height="295" rx="25" fill="url(#onion-shampoo-body)" filter="url(#drop-shadow)" />
      <!-- Highlights -->
      <rect x="168" y="165" width="14" height="260" rx="7" fill="#FFFFFF" opacity="0.2" />
      <line x1="330" y1="170" x2="330" y2="425" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.15" />
      <!-- Label -->
      <rect x="165" y="210" width="170" height="205" rx="8" fill="#360A1C" stroke="#F7A7C0" stroke-width="2.2" />
      <rect x="171" y="216" width="158" height="193" rx="6" fill="none" stroke="#F7A7C0" stroke-width="1" stroke-dasharray="5 3" />
      <!-- Emblem -->
      <circle cx="250" cy="242" r="17" fill="#F7A7C0" opacity="0.25" />
      <path d="M 250 228 C 243 235 243 245 250 252 C 257 245 257 235 250 228 Z" fill="#F7A7C0" />
      <text x="250" y="266" font-family="'Playfair Display', serif" font-size="10" font-weight="700" fill="#F7A7C0" text-anchor="middle" letter-spacing="1.5">SHATAVARI</text>
      <text x="250" y="277" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#E8D7BF" text-anchor="middle" letter-spacing="1">AYURVEDIC</text>
      <!-- Title -->
      <line x1="185" y1="285" x2="315" y2="285" stroke="#F7A7C0" stroke-width="1.2" />
      <text x="250" y="306" font-family="'Playfair Display', serif" font-size="14.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">ONION & KALONJI</text>
      <text x="250" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#D6C4A5" text-anchor="middle">Anti-Hair Fall Cleanser</text>
      <!-- Tag -->
      <rect x="180" y="338" width="140" height="22" rx="11" fill="#F7A7C0" />
      <text x="250" y="353" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#1C1808" text-anchor="middle">SULPHATE & PARABEN FREE</text>
      <text x="250" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F7A7C0" text-anchor="middle">● PARABEN & SLS FREE ●</text>
      <text x="250" y="398" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">NET VOL: 300 ml</text>
    
</svg>